id: git-delete-remote-branch
title: Delete a Remote Branch
xp: 20
estimated_minutes: 5
setup:
  type: shell
  seed_commands:
    - rm -rf $HOME/git-challenge $HOME/git-remote-server.git $HOME/temp-git-repo
    - git init -b main --bare $HOME/git-remote-server.git
    - git init -b main $HOME/temp-git-repo
    - git -C $HOME/temp-git-repo config user.name 'Developer'
    - git -C $HOME/temp-git-repo config user.email 'dev@example.com'
    - echo 'hello' > $HOME/temp-git-repo/hello.txt
    - git -C $HOME/temp-git-repo add hello.txt
    - git -C $HOME/temp-git-repo commit -m 'Initial commit'
    - git -C $HOME/temp-git-repo remote add origin $HOME/git-remote-server.git
    - git -C $HOME/temp-git-repo push -u origin HEAD
    - rm -rf $HOME/temp-git-repo
    - git clone $HOME/git-remote-server.git $HOME/git-challenge
    - git -C $HOME/git-challenge config user.name 'Developer'
    - git -C $HOME/git-challenge config user.email 'dev@example.com'
    - git init -b main $HOME/temp-git-repo
    - git -C $HOME/temp-git-repo config user.name 'Other Developer'
    - git -C $HOME/temp-git-repo config user.email 'other@example.com'
    - git -C $HOME/temp-git-repo remote add origin $HOME/git-remote-server.git
    - git -C $HOME/temp-git-repo pull origin HEAD
    - git -C $HOME/temp-git-repo checkout -b feature-trash
    - echo 'trash code' > $HOME/temp-git-repo/trash.txt
    - git -C $HOME/temp-git-repo add trash.txt
    - git -C $HOME/temp-git-repo commit -m 'Add trash file'
    - git -C $HOME/temp-git-repo push origin feature-trash
    - rm -rf $HOME/temp-git-repo
    - git -C $HOME/git-challenge fetch origin
version: 1
