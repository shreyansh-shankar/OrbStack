id: lnx-check-http-status
title: "Retrieve HTTP status code"
xp: 20
estimated_minutes: 5
setup:
  type: shell
  seed_commands:
    - "mkdir -p $HOME/network-test"
    - "rm -f $HOME/network-test/http_status.txt"
    - "pkill -f mock_serve[r].py || true"
    - "echo '' | base64 -d > /tmp/mock_server.py"
    - "setsid python3 /tmp/mock_server.py >/dev/null 2>&1 &"
    - "sleep 1"
version: 6

