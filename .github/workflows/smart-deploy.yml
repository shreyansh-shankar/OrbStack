name: Smart Deploy

on:
  push:
    branches:
      - main

jobs:

  detect-components:
    name: Detect Changed Components
    runs-on: ubuntu-latest

    outputs:
      cli: ${{ steps.detect.outputs.cli }}
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      landing: ${{ steps.detect.outputs.landing }}
      challenges: ${{ steps.detect.outputs.challenges }}
      vercel_matrix: ${{ steps.detect.outputs.vercel_matrix }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Python dependencies
        run: |
          pip install pyyaml pathspec

      - name: Detect Changed Components
        id: detect
        shell: bash
        run: |

          python <<'EOF'
          import json
          import os
          import subprocess
          import pathspec

          import yaml

          with open(".ci/components.yaml") as f:
              config = yaml.safe_load(f)

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD~1", "HEAD"],
              text=True
          ).splitlines()

          print("\n================ Changed Files ================\n")

          for file in changed:
              print(file)

          print("\n============= Component Analysis ==============\n")

          outputs = []
          vercel_matrix = []

          for component_name, component in config["components"].items():

              matched = False

              for pattern in component["paths"]:

                  spec = pathspec.PathSpec.from_lines(
                      "gitwildmatch",
                      [pattern]
                  )

                  if any(spec.match_file(file) for file in changed):
                      matched = True
                      break

              print(f"{'✓' if matched else '✗'} {component_name}")

              outputs.append(
                  f"{component_name}={'true' if matched else 'false'}"
              )

              if matched and component["deployment"] == "vercel":

                  vercel_matrix.append({
                      "component": component_name,
                      "description": component["description"],
                      "deployment": component["deployment"],
                      "working_directory": component["working_directory"]
                  })

          vercel_json = json.dumps(vercel_matrix)

          print("\n================ Vercel Deploy Matrix ================\n")
          print(vercel_json)

          outputs.append(f"vercel_matrix={vercel_json}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("\n".join(outputs))

          EOF

      - name: Print Outputs
        run: |
          echo "CLI         : ${{ steps.detect.outputs.cli }}"
          echo "Frontend    : ${{ steps.detect.outputs.frontend }}"
          echo "Backend     : ${{ steps.detect.outputs.backend }}"
          echo "Landing     : ${{ steps.detect.outputs.landing }}"
          echo "Challenges  : ${{ steps.detect.outputs.challenges }}"
          echo ""
          echo "Vercel Matrix:"
          echo '${{ steps.detect.outputs.vercel_matrix }}'

  deploy-vercel:
    name: Deploy Vercel Component
    needs: detect-components
    if: needs.detect-components.outputs.vercel_matrix != '[]'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: ${{ fromJson(needs.detect-components.outputs.vercel_matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Deployment Target
        run: |
          echo "================================"
          echo "Component: ${{ matrix.component.component }}"
          echo "Description: ${{ matrix.component.description }}"
          echo "Deployment: ${{ matrix.component.deployment }}"
          echo "Directory: ${{ matrix.component.working_directory }}"
          echo "================================"

      - name: Install Node.js
        if: matrix.component.deployment == 'vercel'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install uv (for Python Vercel backend build)
        if: matrix.component.component == 'backend'
        uses: astral-sh/setup-uv@v5

      - name: Install Vercel CLI
        if: matrix.component.deployment == 'vercel'
        run: npm install -g vercel

      - name: Select Vercel Project ID
        id: project
        shell: bash
        run: |

          if [ "${{ matrix.component.component }}" = "frontend" ]; then
            echo "project_id=${{ secrets.FRONTEND_PROJECT_ID }}" >> $GITHUB_OUTPUT

          elif [ "${{ matrix.component.component }}" = "backend" ]; then
            echo "project_id=${{ secrets.BACKEND_PROJECT_ID }}" >> $GITHUB_OUTPUT

          elif [ "${{ matrix.component.component }}" = "landing" ]; then
            echo "project_id=${{ secrets.LANDING_PROJECT_ID }}" >> $GITHUB_OUTPUT

          else
            echo "Unknown component"
            exit 1
          fi


      - name: Deploy Vercel Project
        if: matrix.component.deployment == 'vercel'

        run: |

          echo "Deploying ${{ matrix.component.component }}"

          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

          if [ -f "${{ matrix.component.working_directory }}/.vercel/.env.production.local" ]; then
            cp "${{ matrix.component.working_directory }}/.vercel/.env.production.local" "${{ matrix.component.working_directory }}/.env.production.local"
          elif [ -f ".vercel/.env.production.local" ]; then
            cp .vercel/.env.production.local "${{ matrix.component.working_directory }}/.env.production.local"
          fi

          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

          vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.project.outputs.project_id }}

  deploy-cli:
    name: Publish CLI (latest)
    needs: detect-components
    if: needs.detect-components.outputs.cli == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build Release Artifacts
        run: make dist

      - name: Delete existing latest release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: Publish latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            dist/tld-* \
            dist/checksums.txt \
            --title "CLI: latest" \
            --notes "Rolling latest build from \`main\`. Updated on every push that changes the CLI.

          **Commit:** \`${{ github.sha }}\`
          **Triggered by:** ${{ github.actor }}" \
            --prerelease \
            --target main