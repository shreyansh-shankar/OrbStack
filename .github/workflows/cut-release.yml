name: Cut CLI Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.3)"
        required: true
        type: string
      also_update_stable:
        description: "Also move the stable tag to this version?"
        required: false
        type: boolean
        default: false

jobs:
  cut-release:
    name: Cut ${{ inputs.version }} from latest
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: ${{ inputs.version }}"
            echo "   Expected format: v1.0.3"
            exit 1
          fi
          echo "✓ Version format OK: ${{ inputs.version }}"

      - name: Download latest release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download latest --dir dist --clobber
          echo "Assets downloaded from latest:"
          ls -lh dist/

      - name: Get latest release info
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(gh release view latest --json body \
            | jq -r '.body' \
            | grep -oP '(?<=`)[0-9a-f]{40}(?=`)' \
            || echo "unknown")
          echo "sha=$sha" >> $GITHUB_OUTPUT

      - name: Create versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ inputs.version }} \
            dist/tld-* \
            dist/checksums.txt \
            --title "tld cli ${{ inputs.version }}" \
            --notes "Release **${{ inputs.version }}** cut from \`latest\` by **${{ github.actor }}**.

          **Source commit:** \`${{ steps.latest.outputs.sha }}\`
          **Released at:** $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Also update stable (if requested)
        if: inputs.also_update_stable == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Moving stable → ${{ inputs.version }}"

          gh release delete stable --yes --cleanup-tag 2>/dev/null || true

          gh release create stable \
            dist/tld-* \
            dist/checksums.txt \
            --title "tld cli: stable" \
            --notes "Stable release pinned to **${{ inputs.version }}** by **${{ github.actor }}**.

          **Source commit:** \`${{ steps.latest.outputs.sha }}\`
          **Promoted at:** $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --latest
