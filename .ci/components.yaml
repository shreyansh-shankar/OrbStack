version: 1

components:

  cli:
    description: "The Last Deploy CLI"
    paths:
      - "agent/**"
      - "Makefile"
    deployment: "github-release"

  frontend:
    description: "Frontend"
    paths:
      - "web/frontend/**"
    deployment: "vercel"

  backend:
    description: "Backend"
    paths:
      - "web/backend/**"
    deployment: "vercel"

  landing:
    description: "Landing Page"
    paths:
      - "web/landing/**"
    deployment: "vercel"

  challenges:
    description: "Challenge Modules"
    paths:
      - "web/challenges/**"
    deployment: "none"