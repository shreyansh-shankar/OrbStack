id: git-revert-bad-commit
title: Revert a Bad Commit
xp: 20
estimated_minutes: 5
setup:
  type: shell
  seed_commands:
    - rm -rf /home/fsociety/git-challenge
    - mkdir -p /home/fsociety/git-challenge
    - git -C /home/fsociety/git-challenge init -b main
    - git -C /home/fsociety/git-challenge config user.name 'Developer'
    - git -C /home/fsociety/git-challenge config user.email 'dev@example.com'
    - echo 'port=8080' > /home/fsociety/git-challenge/app.config
    - git -C /home/fsociety/git-challenge add app.config
    - git -C /home/fsociety/git-challenge commit -m 'Initial commit'
    - echo 'db_logging=true' >> /home/fsociety/git-challenge/app.config
    - git -C /home/fsociety/git-challenge add app.config
    - git -C /home/fsociety/git-challenge commit -m 'Add database logging config'
    - echo 'api_key=SECRET_XYZ' >> /home/fsociety/git-challenge/app.config
    - git -C /home/fsociety/git-challenge add app.config
    - git -C /home/fsociety/git-challenge commit -m 'Add API key config'
version: 1
