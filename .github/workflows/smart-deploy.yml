name: Smart Deploy

on:
  push:
    branches:
      - main

jobs:

  detect-components:
    name: Detect Changed Components
    runs-on: ubuntu-latest

    outputs:
      cli: ${{ steps.detect.outputs.cli }}
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      landing: ${{ steps.detect.outputs.landing }}
      challenges: ${{ steps.detect.outputs.challenges }}
      deployment_matrix: ${{ steps.detect.outputs.deployment_matrix }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Python dependencies
        run: |
          pip install pyyaml

      - name: Detect Changed Components
        id: detect
        shell: bash
        run: |

          python <<'EOF'
          import json
          import os
          import subprocess
          from pathlib import PurePath

          import yaml

          with open(".ci/components.yaml") as f:
              config = yaml.safe_load(f)

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD~1", "HEAD"],
              text=True
          ).splitlines()

          print("\n================ Changed Files ================\n")

          for file in changed:
              print(file)

          print("\n============= Component Analysis ==============\n")

          outputs = []
          deployment_matrix = []

          for component_name, component in config["components"].items():

              matched = False

              for pattern in component["paths"]:

                  if any(PurePath(file).match(pattern) for file in changed):
                      matched = True
                      break

              print(f"{'✓' if matched else '✗'} {component_name}")

              outputs.append(
                  f"{component_name}={'true' if matched else 'false'}"
              )

              if matched and component["deployment"] != "none":

                  deployment_matrix.append({
                      "component": component_name,
                      "description": component["description"],
                      "deployment": component["deployment"],
                      "working_directory": component["working_directory"]
                  })

          matrix_json = json.dumps(deployment_matrix)

          print("\n================ Deployment Matrix ================\n")
          print(matrix_json)

          outputs.append(f"deployment_matrix={matrix_json}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("\n".join(outputs))

          EOF

      - name: Print Outputs
        run: |
          echo "CLI         : ${{ steps.detect.outputs.cli }}"
          echo "Frontend    : ${{ steps.detect.outputs.frontend }}"
          echo "Backend     : ${{ steps.detect.outputs.backend }}"
          echo "Landing     : ${{ steps.detect.outputs.landing }}"
          echo "Challenges  : ${{ steps.detect.outputs.challenges }}"
          echo ""
          echo "Deployment Matrix:"
          echo '${{ steps.detect.outputs.deployment_matrix }}'

  deploy-vercel:
    name: Deploy Vercel Component
    needs: detect-components
    if: needs.detect-components.outputs.deployment_matrix != '[]'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: ${{ fromJson(needs.detect-components.outputs.deployment_matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Deployment Target
        run: |
          echo "================================"
          echo "Component: ${{ matrix.component.component }}"
          echo "Description: ${{ matrix.component.description }}"
          echo "Deployment: ${{ matrix.component.deployment }}"
          echo "Directory: ${{ matrix.component.working_directory }}"
          echo "================================"

      - name: Install Node.js
        if: matrix.component.deployment == 'vercel'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        if: matrix.component.deployment == 'vercel'
        run: npm install -g vercel

      - name: Select Vercel Project ID
        id: project
        shell: bash
        run: |

          if [ "${{ matrix.component.component }}" = "frontend" ]; then
            echo "project_id=${{ secrets.FRONTEND_PROJECT_ID }}" >> $GITHUB_OUTPUT

          elif [ "${{ matrix.component.component }}" = "backend" ]; then
            echo "project_id=${{ secrets.BACKEND_PROJECT_ID }}" >> $GITHUB_OUTPUT

          elif [ "${{ matrix.component.component }}" = "landing" ]; then
            echo "project_id=${{ secrets.LANDING_PROJECT_ID }}" >> $GITHUB_OUTPUT

          else
            echo "Unknown component"
            exit 1
          fi


      - name: Deploy Vercel Project
        if: matrix.component.deployment == 'vercel'
        working-directory: ${{ matrix.component.working_directory }}

        run: |

          echo "Deploying ${{ matrix.component.component }}"

          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

          vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.project.outputs.project_id }}