id: lnx-check-http-status
title: "Retrieve HTTP status code"
xp: 20
estimated_minutes: 5
setup:
  type: shell
  seed_commands:
    - "mkdir -p $HOME/network-test"
    - "rm -f $HOME/network-test/http_status.txt"
    - "pkill -f mock_server.py || true"
    - |
      python3 -c "
      import textwrap
      code = textwrap.dedent('''
          from http.server import HTTPServer, BaseHTTPRequestHandler

          class MyHandler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b\"welcome to devlab\")
              def do_POST(self):
                  self.send_response(201)
                  self.end_headers()
                  self.wfile.write(b\"created successfully\")
              def log_message(self, *args):
                  pass

          HTTPServer((\"127.0.0.1\", 9090), MyHandler).serve_forever()
      ''').strip()
      open('/tmp/mock_server.py', 'w').write(code)
      "
    - "setsid python3 /tmp/mock_server.py >/dev/null 2>&1 &"
    - "sleep 1"
version: 1
